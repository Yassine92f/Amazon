name: ecommerce-prod

# Production stack: MongoDB + Redis + API + Next.js client.
# Secrets are injected via environment (compose reads a sibling .env). Required
# values use the ${VAR:?message} form so a missing secret aborts `up` loudly
# instead of silently falling back to an insecure default.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true # forward SIGTERM so the app's graceful shutdown runs
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/ecommerce?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ecommerce.local}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persist seller-uploaded images across redeploys.
      - uploads_data:/app/uploads
    # Bound to localhost only: the public entrypoint is Caddy (TLS). The host
    # port stays available on the VPS itself for debugging / direct curl.
    ports:
      - '127.0.0.1:${SERVER_PORT:-5001}:5001'
    networks: [backend]

  # TLS reverse proxy — public entrypoint for the API. Caddy obtains and renews
  # Let's Encrypt certificates automatically and proxies WebSocket transparently.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN (e.g. api.tondomaine.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

  client:
    # Front is deployed on Vercel; this service only runs with `--profile full`
    # (all-in-one VPS deployment alternative).
    profiles: ['full']
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Inlined into the bundle at build time (see client/Dockerfile).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
        NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${NEXT_PUBLIC_STRIPE_PUBLIC_KEY:-}
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${CLIENT_PORT:-3000}:3000'
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
