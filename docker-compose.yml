# Simple all-in-one stack for local full-stack testing (builds the prod images
# but with relaxed config). For a hardened production deployment — secret
# validation, healthcheck-gated startup, Mongo auth, internal-only datastores —
# use docker-compose.prod.yml instead.
version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ecommerce

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ecommerce-server
    restart: unless-stopped
    init: true
    ports:
      - '5001:5001'
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ecommerce
      REDIS_URL: redis://redis:6379

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
        NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${NEXT_PUBLIC_STRIPE_PUBLIC_KEY:-}
    container_name: ecommerce-client
    restart: unless-stopped
    init: true
    ports:
      - '3000:3000'
    depends_on:
      - server

volumes:
  mongodb_data:
  redis_data:
